<div class="add-post-container">
  <div class="card-body">
    <h2 class="card-title">Dodaj nowy wpis</h2>

    <div class="form-group">
      <label for="title">Tytuł posta</label>
      <input
        type="text"
        id="title"
        [(ngModel)]="title"
        class="form-control"
        placeholder="Wpisz tytuł..."
      >
    </div>

    <div class="form-group">
      <label for="text">Treść</label>
      <textarea
        id="text"
        rows="4"
        [(ngModel)]="text"
        class="form-control"
        placeholder="O czym chcesz napisać?"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="image">Link do obrazka (URL)</label>
      <input
        type="text"
        id="image"
        [(ngModel)]="imageUrl"
        class="form-control"
        placeholder="https://example.com/image.jpg"
      >
    </div>

    <button (click)="createPost()" class="btn-submit">
      Opublikuj post
    </button>
  </div>
</div>
