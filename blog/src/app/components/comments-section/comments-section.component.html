<div class="comments-container mt-5">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h4 class="section-title m-0">
      <i class="bi bi-chat-dots me-2"></i>Komentarze
      <span class="badge rounded-pill bg-primary ms-2">{{ comments.length }}</span>
    </h4>
  </div>

  <div class="comments-list mb-4">
    <div *ngIf="comments.length === 0" class="text-muted text-center py-4 border rounded-3 bg-light-subtle">
      <i class="bi bi-chat-left-quote fs-2 d-block mb-2"></i>
      Brak komentarzy. Bądź pierwszy!
    </div>

    <div *ngFor="let comment of comments" class="comment-item p-3 mb-3 rounded-3 shadow-sm border-start">
      <div class="d-flex justify-content-between align-items-start">
        <div class="d-flex align-items-center gap-3">
          <div class="avatar-circle shadow-sm">
            {{ comment.userId?.name?.charAt(0) || '?' }}
          </div>
          <div>
            <div class="fw-bold author-name">{{ comment.userId?.name || 'Anonim' }}</div>
            <small class="text-muted date-text">
              <i class="bi bi-clock me-1"></i>{{ comment.createdAt | date:'short' }}
            </small>
          </div>
        </div>

        <button *ngIf="isAuthor(comment.userId)"
                class="btn btn-outline-danger btn-sm btn-action-delete d-flex align-items-center gap-1 px-2"
                (click)="deleteComment(comment._id)"
                title="Usuń komentarz">
          <i class="bi bi-trash"></i>
          <span class="fw-bold">Usuń</span>
        </button>
      </div>

      <div class="mt-3 comment-text">
        {{ comment.text }}
      </div>
    </div>
  </div>

  <div class="add-comment-area p-4 rounded-3 border bg-light-subtle" *ngIf="isLoggedIn(); else loginPrompt">
    <h5 class="mb-3">Dodaj komentarz</h5>
    <div class="form-floating mb-3">
      <textarea
        class="form-control"
        placeholder="Napisz komentarz..."
        id="commentText"
        [(ngModel)]="newCommentText"
        style="height: 120px"></textarea>
      <label for="commentText">Twoja treść...</label>
    </div>
    <div class="d-flex justify-content-end">
      <button class="btn btn-primary px-4 py-2" (click)="addComment()" [disabled]="!newCommentText.trim()">
        <i class="bi bi-send me-2"></i>Wyślij
      </button>
    </div>
  </div>

  <ng-template #loginPrompt>
    <div class="alert alert-info border-0 shadow-sm text-center py-4">
      <i class="bi bi-info-circle me-2"></i>
      <a routerLink="/login" class="alert-link">Zaloguj się</a>, aby dodać komentarz.
    </div>
  </ng-template>
</div>
