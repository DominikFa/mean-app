<div class="card h-100" style="width: 18rem;">
  <div class="position-relative">
    <blog-item-image [image]="image"/>

    <i class="fa position-absolute top-0 end-0 m-2 p-2 bg-white rounded-circle"
       [ngClass]="{'fa-heart': isFavorite, 'fa-heart-o': !isFavorite}"
       (click)="toggleFavorite($event)"
       style="cursor: pointer; color: red; font-size: 1.5rem;">
    </i>
  </div>
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ title }}</h5>
    <div class="card-text mb-3">
      <blog-item-text [text]="text" [_id]="_id"/>
    </div>
    <app-like [postId]="_id" [likes]="likes" [authorId]="authorId"></app-like>
    <app-rating [postId]="_id" class="mt-auto"></app-rating>
  </div>
</div>
